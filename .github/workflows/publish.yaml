name: Publish CI builder images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kaniko-oss
            tag: v1.29.0-bash2
          - name: kaniko-gitlab
            tag: v1.25.19-1-bash2
          - name: buildkit-rootless
            tag: v0.33.1-bash2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.name }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/moneysmartco/ci-builder-images/${{ matrix.name }}:${{ matrix.tag }}
          labels: org.opencontainers.image.source=https://github.com/moneysmartco/ci-builder-images
